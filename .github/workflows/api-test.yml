name: GoRest API CI/CD Testing

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 3. Install Newman
        run: npm install -g newman

      - name: 4. Execute Automated API Tests
        run: |
          newman run "2474802015413_NguyenXuanNhan_GoRest.postman_collection.json" \
            -e "2474802015413_NguyenXuanNhan_GoRest_Env.postman_environment.json" \
            -d users.csv \
            --env-var "token=${{ secrets.GOREST_TOKEN }}" \
            --delay-request 300
