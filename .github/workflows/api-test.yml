name: API Test
on: [push, workflow_dispatch]

jobs:
  newman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g newman
      - run: |
          newman run "2474802015413_NguyenXuanNhan_GoRest.postman_collection.json" \
            -e "2474802015413_NguyenXuanNhan_GoRest_Env.postman_environment.json" \
            -d users.csv \
            --env-var "baseurl=https://gorest.co.in" \
            --env-var "token=${{ secrets.GOREST_TOKEN }}"
